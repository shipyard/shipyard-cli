version: 2

env:
  - GITHUB_TOKEN={{ if index .Env "GITHUB_TOKEN" }}{{ .Env.GITHUB_TOKEN }}{{else}}''{{end}}

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: shipyard
    # Reproducible builds: -trimpath keeps the checkout path out of the binary,
    # -buildvcs=false keeps Go's git stamp out (it differs between a clone, a
    # worktree and a source tarball; the commit is in GitCommit below), and
    # mod_timestamp sets every file's mtime to the commit time. Rebuilding a tag
    # with the Go and GoReleaser versions in release.yaml gives the same bytes
    # wherever it runs; scripts/check-reproducible.sh checks this.
    flags:
      - -trimpath
      - -buildvcs=false
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/shipyard/shipyard-cli/version.GitCommit={{.ShortCommit}}
      - -X github.com/shipyard/shipyard-cli/version.Version={{.Version}}
archives:
  - formats:
      - binary
    name_template: "shipyard-{{ .Os }}-{{ .Arch }}"
checksum:
  name_template: 'checksums.txt'
# An SPDX SBOM per binary (shipyard-<os>-<arch>.sbom.json, or
# shipyard-windows-<arch>.exe.sbom.json), uploaded with the release and listed
# in checksums.txt. Needs syft on the PATH.
sboms:
  - artifacts: binary
    documents:
      - "{{ .ArtifactName }}.sbom.json"
changelog:
  disable: true
release:
  prerelease: auto
brews:
  - name: shipyard
    repository:
      owner: shipyard
      name: homebrew-tap
      branch: main

    commit_author:
      name: shipyard
      email: hello@shipyard.build

    commit_msg_template: "Formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Formula

    skip_upload: "{{ if .Prerelease }}true{{ else }}false{{ end }}"

    homepage: "https://shipyard.build"
    description: "A tool to manage Ephemeral Environments on the Shipyard platform"
    license: "Apache-2.0"
