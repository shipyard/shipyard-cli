name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: golangci-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.22.1"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks git --config=.gitleaks.toml --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --verbose
          else
            gitleaks git --config=.gitleaks.toml --verbose
          fi

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests (no cache)
        run: go test -v ./...

  # install.sh is what curl | bash users run, and its checksum refusals are
  # what keeps a bad download off their machines. Both hash tools are covered
  # on each OS: macOS ships sha256sum too, so install-test.sh forces the shasum
  # fallback with a PATH that lacks sha256sum.
  install-script:
    name: Install script (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test install.sh
        run: ./scripts/install-test.sh

      # The release gate only ever sees good builds in CI, so its refusals are
      # tested here. It runs on Linux, as the release does.
      - name: Test check-dist.sh
        if: runner.os == 'Linux'
        run: ./scripts/check-dist-test.sh

      # What release.sh offers after a failed release, including whether it
      # may offer to delete the tag.
      - name: Test release.sh recovery
        run: ./scripts/release-test.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m --issues-exit-code=0
