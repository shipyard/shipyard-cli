name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; only the release job, which declares its own
# permissions, can write.
permissions:
  contents: read

# Tool versions shared by the snapshot and release builds, so the snapshot
# that's smoke-tested is built the way the release is.
env:
  GORELEASER_VERSION: v2.18.3
  SYFT_VERSION: 1.42.3
  # SHA-256 of syft_<SYFT_VERSION>_linux_amd64.tar.gz, from the release's
  # syft_<SYFT_VERSION>_checksums.txt. Update it with SYFT_VERSION.
  SYFT_SHA256: 0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '^1.24.x'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      # The snapshot builds the SBOMs too, so it fails without syft.
      - name: Install syft
        run: |
          tarball="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl --silent --show-error --location --fail --output "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${tarball}"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/syft"
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}/syft" syft
          echo "${RUNNER_TEMP}/syft" >> "$GITHUB_PATH"

      - name: Build snapshot
        run: goreleaser release --snapshot --clean

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  smoke-test:
    name: Smoke Test (${{ matrix.os }})
    needs: test-and-build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_amd64
          - os: macos-latest
            platform: darwin_arm64
          - os: macos-latest
            platform: darwin_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Run smoke tests
        run: |
          BINARY=$(find dist -path "*${{ matrix.platform }}*" -name "shipyard" -type f | head -1)
          if [[ -z "$BINARY" ]]; then
            echo "Binary for ${{ matrix.platform }} not found in dist/"
            find dist -type f
            exit 1
          fi
          chmod +x "$BINARY"
          echo "BINARY=$BINARY" >> "$GITHUB_ENV"
          ./scripts/smoke-test.sh "$BINARY"

      - name: Run MCP smoke tests
        run: ./scripts/mcp-smoke-test.sh "$BINARY"

  vuln-scan:
    name: Vulnerability Scan
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '^1.24.x'
          cache: true

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      # Every platform from this one runner: govulncheck reads ELF, Mach-O and
      # PE, so the Windows and macOS artifacts are scanned here too.
      - name: Scan release binaries
        run: |
          BINARIES=()
          while IFS= read -r binary; do
            BINARIES+=("$binary")
          done < <(find dist -type f \( -name "shipyard" -o -name "shipyard.exe" \))
          if [[ "${#BINARIES[@]}" -eq 0 ]]; then
            echo "No binaries found in dist/"
            find dist -type f
            exit 1
          fi
          printf 'Scanning %d binaries\n' "${#BINARIES[@]}"
          ./scripts/vuln-scan.sh "${BINARIES[@]}"

  release:
    name: Release
    needs: [smoke-test, vuln-scan]
    runs-on: ubuntu-latest
    # id-token and attestations let the job sign build provenance with its
    # GitHub OIDC identity (Sigstore), so no signing key is stored anywhere.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '^1.24.x'
          # No cache: other runs write it, and this job signs what it builds.
          cache: false

      # Every action and tool in this job is pinned by commit or digest: it can
      # sign provenance and holds the release token, so a moved tag or branch
      # upstream must not change what runs here. syft is fetched directly
      # because sbom-action's download-syft runs an install script from
      # anchore/syft's main branch.
      - name: Install syft
        run: |
          tarball="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl --silent --show-error --location --fail --output "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${tarball}"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/syft"
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}/syft" syft
          echo "${RUNNER_TEMP}/syft" >> "$GITHUB_PATH"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}

      # Records which workflow run, commit and tag built each release asset.
      # checksums.txt lists every uploaded binary and SBOM by its release name;
      # the binaries themselves sit in per-build directories under dist/, so a
      # path glob would miss them. Verify a download with:
      #   gh attestation verify <file> -R shipyard/shipyard-cli \
      #     --signer-workflow shipyard/shipyard-cli/.github/workflows/release.yaml
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-checksums: dist/checksums.txt
