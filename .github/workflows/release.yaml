name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '^1.24.x'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # Same version as the release job, so the snapshot that's smoke-tested
          # is built the way the release is.
          version: v2.18.3
          install-only: true

      # The snapshot builds the SBOMs too, so it fails without syft.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.42.3

      - name: Build snapshot
        run: goreleaser release --snapshot --clean

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  smoke-test:
    name: Smoke Test (${{ matrix.os }})
    needs: test-and-build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_amd64
          - os: macos-latest
            platform: darwin_arm64
          - os: macos-latest
            platform: darwin_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run smoke tests
        run: |
          BINARY=$(find dist -path "*${{ matrix.platform }}*" -name "shipyard" -type f | head -1)
          if [[ -z "$BINARY" ]]; then
            echo "Binary for ${{ matrix.platform }} not found in dist/"
            find dist -type f
            exit 1
          fi
          chmod +x "$BINARY"
          echo "BINARY=$BINARY" >> "$GITHUB_ENV"
          ./scripts/smoke-test.sh "$BINARY"

      - name: Run MCP smoke tests
        run: ./scripts/mcp-smoke-test.sh "$BINARY"

  vuln-scan:
    name: Vulnerability Scan
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '^1.24.x'
          cache: true

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Every platform from this one runner: govulncheck reads ELF, Mach-O and
      # PE, so the Windows and macOS artifacts are scanned here too.
      - name: Scan release binaries
        run: |
          BINARIES=()
          while IFS= read -r binary; do
            BINARIES+=("$binary")
          done < <(find dist -type f \( -name "shipyard" -o -name "shipyard.exe" \))
          if [[ "${#BINARIES[@]}" -eq 0 ]]; then
            echo "No binaries found in dist/"
            find dist -type f
            exit 1
          fi
          printf 'Scanning %d binaries\n' "${#BINARIES[@]}"
          ./scripts/vuln-scan.sh "${BINARIES[@]}"

  release:
    name: Release
    needs: [smoke-test, vuln-scan]
    runs-on: ubuntu-latest
    # id-token and attestations let the job sign build provenance with its
    # GitHub OIDC identity (Sigstore), so no signing key is stored anywhere.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '^1.24.x'
          # No cache: other runs write it, and this job signs what it builds.
          cache: false

      # Pinned by commit: this job can sign provenance and holds the release
      # token, so a moved tag must not change what runs here.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.42.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}

      # Records which workflow run, commit and tag built each release asset.
      # checksums.txt lists every uploaded binary and SBOM by its release name;
      # the binaries themselves sit in per-build directories under dist/, so a
      # path glob would miss them. Verify a download with:
      #   gh attestation verify <file> -R shipyard/shipyard-cli \
      #     --signer-workflow shipyard/shipyard-cli/.github/workflows/release.yaml
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-checksums: dist/checksums.txt
