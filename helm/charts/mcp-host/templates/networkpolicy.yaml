{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-host.fullname" . }}
  labels:
    {{- include "mcp-host.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-host.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Only from the ingress controller, so in-cluster callers can't skip it.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "networkPolicy.ingressNamespace is required: the ingress controller's namespace" .Values.networkPolicy.ingressNamespace }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
