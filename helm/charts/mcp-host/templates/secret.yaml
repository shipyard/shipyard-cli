{{- if and .Values.mcp.existingSecret .Values.mcp.clientSecret -}}
{{- fail "set mcp.existingSecret or mcp.clientSecret, not both" -}}
{{- end -}}
{{- if not .Values.mcp.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-host.fullname" . }}
  labels:
    {{- include "mcp-host.labels" . | nindent 4 }}
type: Opaque
data:
  SHIPYARD_MCP_CLIENT_SECRET: {{ required "mcp.clientSecret or mcp.existingSecret is required: this server's OAuth client secret, matching core's OAUTH_MCP_HOST_CLIENT_SECRET" .Values.mcp.clientSecret | b64enc | quote }}
{{- end }}
