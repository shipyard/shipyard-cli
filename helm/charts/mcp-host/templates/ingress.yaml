{{- if .Values.ingress.enabled -}}
{{- $host := include "mcp-host.host" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mcp-host.fullname" . }}
  labels:
    {{- include "mcp-host.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ default (printf "%s-tls" (include "mcp-host.fullname" .)) .Values.ingress.tlsSecretName }}
  rules:
    # The whole host, not just the MCP path: clients also fetch the protected
    # resource metadata from /.well-known/oauth-protected-resource.
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mcp-host.fullname" . }}
                port:
                  name: http
{{- end }}
